[project]
name = "ha-switch-port-card-pro"
version = "1.1.1" # x-release-please-version
description = "Home Assistant integration + Lovelace card for per-port switch monitoring over SNMP, with optional port-to-device MAC linking learned from the switch FDB."
license = "MIT"
requires-python = ">=3.14.2"
dependencies = ["puresnmp>=2.0.0"]

[dependency-groups]
dev = [
  # Requires Home Assistant 2026.8+, where a shared MAC connection links two
  # device entries (the per-config-entry device split). pytest-homeassistant-
  # custom-component pins HA exactly, so uv resolves the plugin release whose
  # pinned HA satisfies this constraint.
  "homeassistant==2026.8.*",
  "pytest-homeassistant-custom-component>=0.13.323",
  "pytest-cov>=5",
  "mypy>=2.1.0",
]

[tool.uv]
required-version = "==0.12.8"
# HA's test plugin pulls an older mypy; force a build new enough to parse the
# Python 3.14 parenthesis-optional `except A, B:` (PEP 758) syntax.
override-dependencies = ["mypy>=2.1.0"]

[tool.mypy]
# Both the component and the tests refer to it as custom_components.*, so use
# explicit package bases (not mypy_path) to avoid a dual-module-name clash.
explicit_package_bases = true
namespace_packages = true
strict = true

# These libs ship no py.typed, so mypy cannot import their types. (puresnmp and
# x690 ARE typed, so they are deliberately NOT listed — we use their real types.)
[[tool.mypy.overrides]]
module = [
  "pytest_homeassistant_custom_component.*",
  "puresnmp_plugins.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Read by the pre-commit ruff hook (the default rule set is kept; this only sets
# the target version + line width).
[tool.ruff]
target-version = "py314"
line-length = 88

[tool.coverage.run]
source = ["custom_components/switch_port_card_pro"]
