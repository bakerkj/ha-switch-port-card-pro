name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Single target: the HA pinned by the test plugin in pyproject/uv.lock, which
  # is also the hacs.json minimum. Renovate bumps that `==` pin, so this job
  # follows Home Assistant forward on its own.
  tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: tests
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      # --no-default-groups: uv treats `dev` as a default group, so plain
      # `--group test` would still pull mypy into the test matrix.
      - name: Install the locked environment
        run: uv sync --no-default-groups --group test --frozen

      - name: Home Assistant under test
        run: >-
          uv run --no-sync python -c "from homeassistant.const import
          __version__; print(__version__)"

      # Enforced coverage floor. Current suite covers ~52% (const/repairs 100%,
      # entity_manager 86%, config_flow 76%; the port-to-device MAC reconcile is
      # tested against a real device registry). The remaining gaps are the live
      # SNMP coordinator update paths in sensor.py and setup in __init__.py,
      # which need real SNMP I/O. Ratchet this up as those land — never lower it.
      - name: Tests (with coverage gate)
        run: >-
          uv run --no-sync python -m pytest tests/
          --cov=custom_components/switch_port_card_pro --cov-report=term-missing
          --cov-fail-under=50 --durations=10
